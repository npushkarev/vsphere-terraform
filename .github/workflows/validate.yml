name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        run: |
          ./scripts/install-terraform.sh --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: ./scripts/validate.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        shell: powershell
        run: |
          .\scripts\install-terraform.ps1 -BinDir "$env:RUNNER_TEMP\terraform"
          "$env:RUNNER_TEMP\terraform" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate
        shell: powershell
        run: .\scripts\validate.ps1
